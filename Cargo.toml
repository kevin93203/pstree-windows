[package]
name = "pstree-windows"
version = "0.1.0"
edition = "2024"
description = "A small Windows process tree viewer"

[[bin]]
name = "pstree"
path = "src/main.rs"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
